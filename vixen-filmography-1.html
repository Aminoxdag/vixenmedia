async function resolveStudios(force) {
  if (!force && S.sites && Date.now() - S.sitesAt < 6048e5) return;
  R.resolving = true; R.siteErr = null; refreshStudioUI();
  try {
    const res = await Promise.all(CATALOG.map(c => api('/sites', {q:c.name, per_page:25}, {ttl:0}).then(d => ({c, d:d.data || []})).catch(e => ({c, e}))));
    if (res.every(r => r.e)) throw res[0].e;
    const all = []; res.forEach(r => (r.d || []).forEach(x => all.push(x)));
    const sites = {};

      const kids = [...new Set(all.filter(x => !ids.includes(String(x.id)) && x.parent_id != null && ids.includes(String(x.parent_id))).map(x => String(x.id)))];
      sites[r.c.key] = {ids, kids, recs: m.map(x => ({id:String(x.id), name:x.name, logo:normUrl(x.logo) || normUrl(x.favicon), url:x.url || '', parent_id:x.parent_id != null ? String(x.parent_id) : ''}))};

/* ---------- Paginated feed with cancellation ---------- */
class Feed {
  constructor(fn, cb) { this.fn = fn; this.cb = cb; this.reset(); }
  reset() { if (this.ctl) this.ctl.abort(); this.items = []; this.page = 0; this.more = true; this.busy = false; this.err = null; }
  async next() {
    if (this.busy || !this.more || this.err) return;
    this.busy = true; const ctl = this.ctl = new AbortController(); this.cb();
    try {
      const r = await this.fn(this.page + 1, ctl.signal);
      if (ctl !== this.ctl) return;
      const seen = new Set(this.items.map(i => i.id));
      this.items.push(...r.items.filter(i => !seen.has(i.id)));
      this.page = r.page; this.more = r.more; if (r.total != null) this.total = r.total; this.loaded = true;
    } catch (e) { if (ctl !== this.ctl || e.code === 'abort') return; this.err = e; }
    finally { if (ctl === this.ctl) { this.busy = false; this.cb(); } }
  }
}

    p.feed.next();
  }
  return PV.get(id);
}
function perfV(id) { getPV(id); return `<div id="pvh"></div>${panelHTML()}<h2>${t('filmo')}</h2><div id="pvf"></div>`; }
function updatePV() {
  const c = cur(); if (c.v !== 'perf') return;
  const p = getPV(c.a), d = p.d || PF.get(c.a) || {id:c.a, name:'', img:'', aliases:[], bio:'', extras:{}, gallery:[]};
  const h = $('#pvh'); if (!h) return;
  const hd = document.querySelector('header h1'); if (hd && d.name) hd.textContent = d.name;
  const ex = Object.entries(d.extras || {}).filter(([k, v]) => ['string', 'number', 'boolean'].includes(typeof v) && String(v).trim() !== '');
  const items = p.feed.items, cnt = {}, yrs = items.map(s => +s.year).filter(Boolean);
  items.forEach(s => { if (s.studio && s.studio.name) cnt[s.studio.name] = (cnt[s.studio.name] || 0) + 1; });
  const studs = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const bd = d.extras && d.extras.birthday; const age = bd && !isNaN(Date.parse(bd)) ? Math.floor((Date.now() - Date.parse(bd)) / 31557600000) : '';
  const total = p.feed.total != null && !effSel().length ? `<span class="stat">${p.feed.total} ${t('total')}</span>` : '';
  const yr = yrs.length ? `<span class="stat">${Math.min(...yrs)}–${Math.max(...yrs)}</span>` : '';
  h.innerHTML = `<div class="phero">${im(d.img)}<h2>${esc(d.name)}</h2>
${d.aliases && d.aliases.length ? `<div class="dim2">${esc(d.aliases.slice(0, 8).join('، '))}</div>` : ''}
<div>${total}${yr}${age !== '' ? `<span class="stat">${t('age')} ${age}</span>` : ''}</div></div>
${p.err ? errBox(p.err, 'pvd') : ''}
${d.gallery && d.gallery.length ? `<h2>${t('gallery')}</h2><div class="hs">${d.gallery.slice(0, 10).map(g => `<div class="pc" style="width:120px">${im(g)}</div>`).join('')}</div>` : ''}
${d.bio ? `<h2>${t('bio')}</h2><p style="margin:0;white-space:pre-line;color:#c3bfb5">${esc(d.bio)}</p>` : ''}
${ex.length ? `<h2>${t('details')}</h2><dl class="kv">${ex.map(([k, v]) => `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(typeof v === 'boolean' ? (v ? '✓' : '—') : v)}</dd>`).join('')}</dl>` : ''}
${studs.length ? `<h2>${t('workedWith')}</h2><div>${studs.map(([n, k]) => `<span class="chip">${esc(n)} ${k}</span>`).join('')}</div>` : ''}`;
  const f = $('#pvf'); if (f) { f.innerHTML = feedHTML(p.feed, 'pvf', visible(p.feed.items), sceneCard); watch(); }
}

function sceneV(s) {
  if (!s) return '';
  const key = s.studio && CATALOG.map(c => c.key).find(k => S.sites && S.sites[k] && idsFor([k], false).includes(s.studio.id));
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  const link = (u, l, cls) => /^https?:\/\//.test(u) ? `<a class="btn ${cls}" style="text-decoration:none" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${l}</a>` : '';
  return `<div class="cover">${im(s.bg || s.img)}</div><h2 class="ttl">${esc(s.title)}</h2>
<div class="dim2">${esc([s.studio && s.studio.name, s.date].filter(Boolean).join('  /  '))}</div>
<div class="row" style="margin:16px 0">${link(s.url, t('source'), 'p')}${link(s.trailer, t('trailer'), '')}</div>
${s.desc ? `<p style="white-space:pre-line;color:#c3bfb5;margin:0 0 6px">${esc(s.desc)}</p>` : (s.full ? '' : '<i class="sk"></i><i class="sk s"></i>')}
${s.studio ? `<div class="srow" data-act="${key ? 'studio' : ''}" data-k="${key || ''}">${s.studio.logo ? `<img class="logo" referrerpolicy="no-referrer" src="${esc(s.studio.logo)}" alt="">` : '<div class="logo"></div>'}<div style="flex:1"><b>${esc(s.studio.name)}</b></div>${key ? '<span class="meta">›</span>' : ''}</div>` : ''}
${s.perfs.length ? `<h2>${t('cast')}</h2><div class="pg">${s.perfs.map(p => perfCard(p)).join('')}</div>` : ''}
${s.tags && s.tags.length ? `<h2>${t('tags')}</h2><div>${s.tags.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
<dl class="kv">${row(t('date'), s.date)}${row(t('min'), s.mins ? s.mins + ' ' + t('min') : '')}${row(t('director'), s.director)}${row(t('idl'), s.id)}</dl>`;
}

function studiosV() {
  return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="meta">${S.sitesAt ? t('cachedAt') + ': ' + new Date(S.sitesAt).toLocaleDateString() : ''}</span><button class="btn" data-act="resolve">${t('refresh')}</button></div>
${R.resolving ? `<p class="empty">${t('resolving')}</p>` : ''}${R.siteErr ? `<div class="err">${esc(errMsg(R.siteErr))}</div>` : ''}
${CATALOG.map(c => {
    const s = S.sites && S.sites[c.key]; const r = s && s.recs[0];
    return `<div class="srow" data-act="${s && s.ids.length ? 'studio' : ''}" data-k="${c.key}">${r && r.logo ? `<img class="logo" loading="lazy" referrerpolicy="no-referrer" src="${esc(r.logo)}" alt="">` : '<div class="logo"></div>'}
<div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="meta">${s && s.ids.length ? t('idl') + ': ' + esc(s.ids.join(', ')) + (s.kids.length ? ' · ' + t('children') + ': ' + s.kids.length : '') : (R.resolving ? '…' : t('notFound'))}</div></div>${s && s.ids.length ? '<span class="meta">›</span>' : ''}</div>`;
  }).join('')}`;
}
function studioV(key) {
  if (!ST.has(key)) { const f = new Feed((p, s) => fetchScenes({q:'', page:p, signal:s, keys:[key]}), () => updateST()); ST.set(key, f); f.next(); }
  return '<div id="stf"></div>';
}
function updateST() { const c = cur(); if (c.v !== 'studio') return; const f = ST.get(c.a), el = $('#stf'); if (el) { el.innerHTML = feedHTML(f, 'stf', f.items, sceneCard); watch(); } }

function settingsV() {
  const sel = (id, opts, v) => `<select id="${id}">${opts.map(([a, b]) => `<option value="${a}" ${v === a ? 'selected' : ''}>${b}</option>`).join('')}</select>`;
  return `<div class="panel" style="padding:0 16px"><div class="set"><span>${t('lang')}</span>${sel('s_lang', [['ar', 'العربية'], ['en', 'English']], S.lang)}</div>
<div class="set"><span>${t('theme')}</span>${sel('s_theme', [['oled', t('oled')], ['dim', t('dim')]], S.theme)}</div>
<div class="set"><span>${t('defType')}</span>${sel('s_type', [['all', t('all')], ['scenes', t('scenes')], ['performers', t('performers')]], S.type)}</div>
<div class="set"><span>${t('layout')}</span>${sel('s_view', [['grid', t('grid')], ['list', t('list')]], S.view)}</div>
<div class="set"><span>${t('studios')}</span><button class="btn" data-act="nav" data-v="studios">›</button></div>
<div class="set"><span>${t('saveDef')} (${S.sel.length})</span><button class="btn" data-act="savedef">OK</button></div>
<div class="set" style="flex-wrap:wrap"><span>${t('token')}</span><div class="row" style="flex:1 1 100%"><input id="tok" class="inp" type="password" autocomplete="off" placeholder="${S.token ? '••••••••' : 'default'}" style="flex:1;width:auto"><button class="btn p" data-act="savetok">${t('saveTok')}</button></div></div></div>
<div class="row" style="margin:14px 0"><button class="btn" data-act="clearhist">${t('clearHist')}</button><button class="btn" data-act="clearcache">${t('clearCache')}</button></div>
<h2>${t('debug')}</h2><div class="dbg">${esc(R.log.join('\n') || '—')}</div>`;
}

/* ================= EVENTS ================= */
const toast = {};
function pushRecent(kind, o) {
  const key = kind === 'S' ? 'recS' : 'recP';
  S[key] = [o, ...S[key].filter(x => x.id !== o.id)].slice(0, 20); save();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, k = el.dataset.k;
  if (navigator.vibrate && (a === 'nav' || a === 'fav')) navigator.vibrate(8);
  switch (a) {
    case 'nav': if (stack.length === 1 && cur().v === el.dataset.v) scrollTo({top:0, behavior:'smooth'}); else root(el.dataset.v); break;
    case 'fav': { const c = cur(), isS = c.v === 'scene', m = isS ? S.favS : S.favP; if (m[c.a]) delete m[c.a]; else { const o = isS ? SC.get(c.a) : PF.get(c.a); if (o) m[c.a] = o; } save(); el.classList.toggle('on', !!m[c.a]); break; }
    case 'back': if (stack.length > 1) history.back(); else root('search'); break;
    case 'go': go(el.dataset.v); break;
    case 'filters': R.fo = !R.fo; $('#fpan').innerHTML = R.fo ? filtHTML() : ''; break;
    case 'scene': { const s = SC.get(id); if (s) { pushRecent('S', s); addHist(R.q); go('scene', id); } break; }
    case 'perf': { const p = PF.get(id); if (p) pushRecent('P', {id:p.id, name:p.name, img:p.img}); addHist(R.q); go('perf', id); break; }
    case 'studio': go('studio', k); break;
    case 'type': S.type = k; save(); if (cur().v === 'search') { render(); runSearch(true); } break;
    case 'panel': R.panel = !R.panel; { const sp = $('#sp'); if (sp) sp.outerHTML = panelHTML(); } break;
    case 'adv': R.adv = !R.adv; render(); break;
    case 'selall': S.sel = CATALOG.filter(c => S.sites && S.sites[c.key] && S.sites[c.key].ids.length).map(c => c.key); save(); refreshStudioUI(); onFilter(); break;
    case 'vmg': S.sel = CATALOG.filter(c => S.sites && S.sites[c.key] && S.sites[c.key].ids.length).map(c => c.key); save(); refreshStudioUI(); onFilter(); break;
    case 'selnone': S.sel = []; save(); refreshStudioUI(); onFilter(); break;
    case 'resetf': S.sel = []; S.hideUnknown = false; R.fy = ''; R.fr = ''; R.sort = 'rel'; save(); if ($('#hu')) $('#hu').checked = false; refreshStudioUI(); onFilter(); break;
    case 'quick': S.sel = S.sel.includes(k) ? S.sel.filter(x => x !== k) : [...S.sel, k]; save(); root('search'); R.q = R.q; runSearch(true); break;
    case 'hq': R.q = el.dataset.q; if (cur().v !== 'search') root('search'); else render(); $('#q').value = R.q; runSearch(true); break;
    case 'clearhist': S.hist = []; save(); render(); break;
    case 'retry': { const f = k === undefined ? el.dataset.f : el.dataset.f; const feed = f === 'sf' ? R.sf : f === 'pf' ? R.pf : f === 'stf' ? ST.get(cur().a) : f === 'pvf' ? getPV(cur().a).feed : null;
      if (feed) { feed.err = null; feed.next(); } else if (f === 'pvd') { PV.delete(cur().a); render(); } break; }
    case 'resolve': resolveStudios(true); break;
    case 'savedef': S.defSel = [...S.sel]; save(); el.textContent = '✓'; break;
    case 'savetok': { const v = $('#tok').value.trim(); if (v) { S.token = v; cache.clear(); save(); $('#tok').value = ''; $('#tok').placeholder = '✓'; } break; }
    case 'clearcache': cache.clear(); S.sites = null; S.sitesAt = 0; S.recP = []; S.recS = []; PV.clear(); ST.clear(); save(); el.textContent = '✓'; resolveStudios(true); break;
  }
});
let deb;
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { const a = !!(e.target.value.trim() || effSel().length); $('#top').classList.toggle('act', a); $('#main').classList.toggle('idle', !a); clearTimeout(deb); deb = setTimeout(() => runSearch(), 450); }
  if (id === 'ss') { const l = $('#sl'); if (l) l.innerHTML = listHTML(e.target.value); }
});
document.addEventListener('keydown', e => { if (e.target.id === 'q' && e.key === 'Enter') { clearTimeout(deb); addHist(e.target.value.trim()); runSearch(); e.target.blur(); } });
document.addEventListener('change', e => {
  const el = e.target, id = el.id;
  if (el.classList.contains('cbst')) { const k = el.dataset.k; S.sel = el.checked ? [...new Set([...S.sel, k])] : S.sel.filter(x => x !== k); save(); document.querySelectorAll('.scount').forEach(x => x.textContent = S.sel.length); onFilter(); }
  else if (id === 'hu') { S.hideUnknown = el.checked; save(); onFilter(); }
  else if (id === 'sort') { R.sort = el.value; updateRes(); }
  else if (id === 'fy') { R.fy = el.value.trim(); updateRes(); }
  else if (id === 'fr') { R.fr = el.value.trim(); updateRes(); }
  else if (id === 's_lang') { S.lang = el.value; save(); render(); }
  else if (id === 's_theme') { S.theme = el.value; save(); render(); }
  else if (id === 's_type') { S.type = el.value; save(); }
  else if (id === 's_view') { S.view = el.value; save(); }
});

/* ================= START ================= */
render();
resolveStudios(false);
</script>
</body>
</html>
